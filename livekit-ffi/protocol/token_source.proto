syntax = "proto2";

package livekit.proto;
option csharp_namespace = "LiveKit.Proto";

import "handle.proto";
import "track.proto";

// Create a new TokenSource
message NewTokenSourceRequest {
  required TokenSourceType type = 1;
}

// Created a new TokenSource
message NewTokenSourceResponse {
    required OwnedTokenSource handle = 1;
}

// Fetches a token from a TokenSource
message TokenSourceFetchRequest {
}

// Fetched a token from a TokenSource
message TokenSourceFetchResponse {
}

enum TokenSourceType {
  LITERAL = 0;
  SANDBOX = 1;
  ENDPOINT = 2;
}

message OwnedTokenSource {
  required FfiOwnedHandle handle = 1;
}